name: CI

# Everything project-specific in this workflow comes from harness.config.json,
# except the branch below: GitHub evaluates `on:` before any step runs, so a
# trigger cannot read a config file. It is the one line to change alongside
# `git.baseBranch` -- here it is pinned to the integration branch because this
# repository's default branch is a leftover session branch and a default-branch
# trigger would never fire.
# pull_request is left unfiltered because it is simpler and checks every PR.
#
# `paths-ignore` was tried here to stop log-only commits running CI, and does
# not work for `pull_request`: a commit touching only audit_log/ still ran,
# because the filter is evaluated against the pull request's whole diff rather
# than the push that updated it. The loop it was meant to cut is cut at the
# source instead -- the per-turn log is staged outside git until there is other
# work to commit it with. See scripts/fold-logs.mjs.
on:
  pull_request:
  push:
    branches: [agentic-ai-harness-v1, hyper-agentic-ai-harness]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # agent-config-diff.sh compares against the base with a three-dot
          # range, which needs a merge base. The default depth-1 checkout has
          # none, and the step silently found nothing.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Everything project-specific comes from harness.config.json, so this
      # workflow is the same file in every repository using the harness. The
      # harness checks below always run; the application checks run only once a
      # project is wired up.
      - name: Harness config
        id: cfg
        run: node scripts/config.mjs --github-output >> "$GITHUB_OUTPUT"

      # An application gate that cannot run must not look like one that passed.
      # With no app configured the steps below are skipped, and a skipped step
      # is a grey tick next to five green ones -- so say it in the summary.
      - name: No application configured
        if: steps.cfg.outputs.app_dir == ''
        run: |
          {
            echo "### Application checks did not run"
            echo
            echo 'harness.config.json has no `app.dir`, so install, typecheck,'
            echo 'tests, the clock boundary and mutation testing were skipped.'
            echo 'They did not pass. Set `app.dir` to turn them on.'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install
        if: steps.cfg.outputs.app_dir != ''
        working-directory: ${{ steps.cfg.outputs.app_dir }}
        run: ${{ steps.cfg.outputs.app_install }}
      - name: Typecheck
        if: steps.cfg.outputs.app_dir != ''
        working-directory: ${{ steps.cfg.outputs.app_dir }}
        run: ${{ steps.cfg.outputs.app_typecheck }}
      - name: Test
        if: steps.cfg.outputs.app_dir != ''
        working-directory: ${{ steps.cfg.outputs.app_dir }}
        run: ${{ steps.cfg.outputs.app_test }}

      # The unit suite cannot reach the shell -- the clock boundary puts every
      # untestable thing in one file by design, and nothing was opening it. The
      # browser is what found a fresh ten-mine game reporting zero mines left,
      # past fifty-two green tests. The driver is installed globally because
      # app/smoke.mjs resolves it that way and the application's own
      # dependencies stay free of it.
      - name: Browser driver
        if: steps.cfg.outputs.app_smoke != ''
        run: |
          npm install -g playwright@1.56.1
          npx --yes playwright@1.56.1 install --with-deps chromium
      - name: Smoke
        if: steps.cfg.outputs.app_smoke != ''
        run: node scripts/smoke.mjs

      # Configured but not run is not a pass. If the smoke command is set and
      # the steps above were skipped for any reason, say so in the summary
      # rather than leaving a grey tick beside the green ones.
      - name: No smoke check configured
        if: steps.cfg.outputs.app_dir != '' && steps.cfg.outputs.app_smoke == ''
        run: |
          {
            echo "### The shell was not checked"
            echo
            echo 'harness.config.json sets no `app.smoke`, so nothing drove the'
            echo 'application in a browser. The unit suite cannot reach the file'
            echo 'holding the clock, the randomness and the DOM.'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The repository is worked on from a cloud session and from a dev
      # container, and the flow is only identical if both environments really do
      # satisfy the same assumptions. doctor.sh asserts them — including running
      # the hooks and checking their exit codes, since a hook that quietly does
      # nothing in one environment is the failure this is here to catch. CI is a
      # third environment, so it is a fair check on the assumptions themselves.
      - name: Environment contract
        run: bash scripts/doctor.sh

      # doctor.sh must run the same checks here as it does on a workstation.
      # Three of its cases took their probe from $HOME/.claude/projects, which
      # this runner does not have, so they were skipped -- printing neither ok
      # nor bad, and leaving doctor.sh green with those guards deleted.
      - name: Same everywhere
        run: bash scripts/same-everywhere.sh

      # CLAUDE.md once called a grep "the check" keeping clocks and randomness
      # out of everything but the entry point. Nothing ran it. This does, when a
      # project asks for it.
      - name: Clock boundary
        if: steps.cfg.outputs.clock_boundary == 'on'
        run: node scripts/clock-boundary.mjs

      # A passing suite proves the tests ran, not that they would catch
      # anything. Each mutant damages behaviour and must be noticed.
      - name: Mutation
        if: steps.cfg.outputs.mutants != '0'
        run: node scripts/mutate.mjs

      # The ledger says each failure is caught. These replay it: every case
      # breaks something in a throwaway copy and asserts the named check fails,
      # having first required it to pass.
      - name: Harness evals
        run: bash evals/run.sh

      # evals/run.sh is what makes every other check's ledger row honest, and
      # nothing replayed it -- untested code deciding whether tested code can be
      # trusted. It cannot be an eval case: the runner refuses a CHECK that
      # re-enters it.
      - name: Eval runner self-test
        run: bash scripts/eval-runner.sh

      # learn.mjs is what makes the ledger's "verified by breaking" column
      # earned rather than typed. Its refusal path is the part of it that
      # matters and the part least likely to be exercised, so it is exercised.
      - name: Learn refuses unearned rows
        run: bash scripts/learn-check.sh

      # `on:` is evaluated before any step runs, so the push trigger is the one
      # line that cannot read harness.config.json. Keeping it in step with
      # git.baseBranch was a comment until this check existed, and both had
      # drifted to a session branch from a finished project.
      - name: CI trigger
        run: node scripts/ci-trigger.mjs

      # The ledger pairs every failure this harness has had with the check that
      # now catches it. It is only worth having if the checks are real, so this
      # asserts that each one still exists — a removed check means the failure
      # can happen again, and the table would otherwise still claim it cannot.
      - name: Failure ledger
        run: bash scripts/ledger.sh

      # When something failed, say which one to fix first, on the checks page.
      # A CI log is a wall of output read on a phone; the work order is the same
      # results ordered by what causes what, with the evidence pulled out. It
      # runs on failure only, and adds nothing to a green run.
      - name: Work order
        if: failure()
        run: |
          {
            echo "### What to fix first"
            echo
            echo '```'
            node scripts/autopilot.mjs --quick || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # What this change does to the agent's own behaviour, written to the run
      # summary so it is on the checks page rather than buried in a log. It
      # fails only when a guard is weaker than on the base — adding one never
      # blocks. Needs the base branch, which the default checkout does not
      # fetch.
      - name: Agent behaviour review
        if: github.event_name == 'pull_request'
        run: |
          bash scripts/agent-config-diff.sh "${{ github.base_ref }}" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
