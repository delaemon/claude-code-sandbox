name: CI

# push is pinned to puyo-puyo-web: the repository default branch is a leftover
# session branch, so a default-branch trigger would never fire for this project.
# pull_request is left unfiltered because it is simpler and checks every PR in
# the repository. Nothing is ever merged into the default branch here.
on:
  pull_request:
  push:
    branches: [puyo-puyo-web]

permissions:
  contents: read

defaults:
  run:
    working-directory: puyopuyo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: puyopuyo/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # The repository is worked on from a cloud session and from a dev
      # container, and the flow is only identical if both environments really do
      # satisfy the same assumptions. doctor.sh asserts them — including running
      # the hooks and checking their exit codes, since a hook that quietly does
      # nothing in one environment is the failure this is here to catch. CI is a
      # third environment, so it is a fair check on the assumptions themselves.
      - name: Environment contract
        working-directory: .
        run: bash scripts/doctor.sh
